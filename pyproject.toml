[project]
name = "job-monitor"
version = "4.0.0"
description = "Job Monitor - Gmail job alerts with matching and Telegram notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client==2.147.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.1",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "python-docx==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.6.5",
    "black==24.8.0",
    "mypy==1.11.2",
    "types-requests==2.32.0.20240914",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = "."
include = ["*"]
exclude = ["tests*", "data*", "logs*", "venv*", ".venv*", "__pycache__*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "T201"]
exclude = [".venv", "venv", "__pycache__", ".git", "data", "logs", "*.egg-info", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = "/(\\.venv|venv|\\.git|\\.hg|\\.mypy_cache|\\.tox|\\.ruff_cache|build|dist|data|logs)/"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "tests/",
    "venv/",
    ".venv/",
    "data/",
    "logs/",
    "__pycache__/",
]

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bs4"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google_auth_oauthlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "googleapiclient.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "resume_tailor"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]